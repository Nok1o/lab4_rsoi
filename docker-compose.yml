services:
  gateway-service:
    build:
      context: backend
      dockerfile: deploy/docker/gateway/Dockerfile
    restart: on-failure
    environment:
      PORT: "8080"
      LIBRARY_SERVICE_URL: http://library-service:8060
      RATING_SERVICE_URL: http://rating-service:8050
      RESERVATION_SERVICE_URL: http://reservation-service:8070
      REDIS_URL: redis://redis:6379/0
    depends_on:
      library-service:
        condition: service_started
      rating-service:
        condition: service_started
      reservation-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"

  reservation-service:
    build:
      context: backend
      dockerfile: deploy/docker/reservation/Dockerfile
    restart: on-failure
    environment:
      PORT: "8070"
      DATABASE_URL: postgres://program:test@postgres:5432/reservations?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RESERVATION_PORT:-8070}:8070"

  rating-service:
    build:
      context: backend
      dockerfile: deploy/docker/rating/Dockerfile
    restart: on-failure
    environment:
      PORT: "8050"
      DATABASE_URL: postgres://program:test@postgres:5432/ratings?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RATING_PORT:-8050}:8050"

  library-service:
    build:
      context: backend
      dockerfile: deploy/docker/library/Dockerfile
    restart: on-failure
    environment:
      PORT: "8060"
      DATABASE_URL: postgres://program:test@postgres:5432/libraries?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LIBRARY_PORT:-8060}:8060"

  redis:
    image: redis:7.4-alpine
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: library/postgres:13
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d libraries"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
