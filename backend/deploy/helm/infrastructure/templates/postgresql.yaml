apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrastructure.postgresqlName" . }}
  labels:
    app.kubernetes.io/name: postgresql
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Governing service for the StatefulSet's stable Pod DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrastructure.postgresqlName" . }}-headless
  labels:
    app.kubernetes.io/name: postgresql
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "infrastructure.postgresqlName" . }}
  labels:
    app.kubernetes.io/name: postgresql
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "infrastructure.postgresqlName" . }}-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: LIBRARIES_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: LIBRARIES_DB_PASSWORD
            - name: RESERVATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: RESERVATIONS_DB_PASSWORD
            - name: RATINGS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: RATINGS_DB_PASSWORD
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: schemas
              mountPath: /etc/postgresql/schemas
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ include "infrastructure.postgresqlName" . }}-init
            items:
              - key: 10-init.sql
                path: 10-init.sql
        - name: schemas
          configMap:
            name: {{ include "infrastructure.postgresqlName" . }}-init
            items:
              - key: libraries.sql
                path: libraries.sql
              - key: reservations.sql
                path: reservations.sql
              - key: ratings.sql
                path: ratings.sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size | quote }}
