apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infrastructure.redisName" . }}-config
  labels:
    app.kubernetes.io/name: redis
    {{- include "infrastructure.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy noeviction
