image:
  repository: lab4_rsoi
  tagPrefix: rating-

port: 8050

env:
  - name: DB_HOST
    value: library-infra-postgresql
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: ratings
  - name: DB_USER
    value: rating_service
  - name: DB_SSLMODE
    value: disable
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgresql-credentials
        key: RATINGS_DB_PASSWORD
